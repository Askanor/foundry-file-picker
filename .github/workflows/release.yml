# Push a tag like v0.2.0 to publish a release. Foundry installs and updates
# the module from the manifest URL in module.json, which always points at the
# latest release's module.json.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Stamp version and download URL into module.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          download="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/module.zip"
          jq --arg version "$version" --arg download "$download" \
            '.version = $version | .download = $download' module.json > module.json.new
          mv module.json.new module.json

      - name: Package
        run: zip -r module.zip module.json scripts styles templates lang LICENSE README.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" module.json module.zip --generate-notes
